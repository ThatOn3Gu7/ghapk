name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.2.6)'
        required: true
        default: 'v4.2.6'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v4.2.6"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Building ghapk version ${VER} (tag ${TAG})"

      - name: Build All Targets
        run: |
          VER="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X main.appVersion=${VER}"
          mkdir -p bin

          echo "Building Android (arm64)..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-android-arm64 .

          echo "Building Linux (amd64)..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-linux-amd64 .

          echo "Building Linux (arm64)..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-linux-arm64 .

          echo "Building macOS (arm64 Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-darwin-arm64 .

          echo "Building macOS (amd64 Intel)..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-darwin-amd64 .

          echo "Building Windows (amd64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-windows-amd64.exe .

          echo "Calculating SHA256 checksums..."
          cd bin && sha256sum * > sha256sums.txt && cd ..

      - name: Package Source Archive
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          tar --exclude='bin' --exclude='.git' -czf "bin/ghapk-${TAG}-source.tar.gz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ghapk ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/ghapk-android-arm64
            bin/ghapk-linux-amd64
            bin/ghapk-linux-arm64
            bin/ghapk-darwin-arm64
            bin/ghapk-darwin-amd64
            bin/ghapk-windows-amd64.exe
            bin/sha256sums.txt
            bin/ghapk-${{ steps.version.outputs.tag }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
