name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.3.0)'
        required: true
        default: 'v4.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v4.3.0"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Building ghapk version ${VER} (tag ${TAG})"

      - name: Build All Targets
        run: |
          VER="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X main.appVersion=${VER}"
          mkdir -p bin

          echo "Building Android (arm64)..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-android-arm64 .

          echo "Building Linux (amd64)..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-linux-amd64 .

          echo "Building Linux (arm64)..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-linux-arm64 .

          echo "Building macOS (arm64 Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-darwin-arm64 .

          echo "Building macOS (amd64 Intel)..."
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-darwin-amd64 .

          echo "Building Windows (amd64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/ghapk-windows-amd64.exe .

      - name: Package Source Archive
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git archive --format=tar --prefix="ghapk-${TAG}/" HEAD | gzip -n > "bin/ghapk-${TAG}-source.tar.gz"
          cd bin && sha256sum ghapk-* > sha256sums.txt

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s\n' "$response" | grep -q '^HTTP/[^ ]* 404'; then
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ghapk ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          files: |
            bin/ghapk-android-arm64
            bin/ghapk-linux-amd64
            bin/ghapk-linux-arm64
            bin/ghapk-darwin-arm64
            bin/ghapk-darwin-amd64
            bin/ghapk-windows-amd64.exe
            bin/sha256sums.txt
            bin/ghapk-${{ steps.version.outputs.tag }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
