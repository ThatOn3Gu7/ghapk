<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb"/>
      <stop offset="30%" stop-color="#585b70"/>
      <stop offset="70%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>

    <!-- Android Lime Green -->
    <linearGradient id="androidGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="10%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#40a02b"/>
    </linearGradient>

    <!-- Lightning Cyan Glow -->
    <linearGradient id="lightningCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="40%" stop-color="#89dceb"/>
      <stop offset="100%" stop-color="#04a5e5"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Rim -->
  <polygon points="256,16 464,136 464,376 256,496 48,376 48,136" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Hexagon Accent Line -->
  <polygon points="256,28 452,142 452,370 256,484 60,370 60,142" fill="none" stroke="#313244" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>

  <!-- Left Lightning Bolt (Subtle) -->
  <path d="M190,135 L145,190 L175,190 L135,260 L180,205 L155,205 Z" fill="url(#lightningCyan)" opacity="0.85" filter="url(#glow)"/>

  <!-- Android Robot Head -->
  <g transform="translate(0, 5)">
    <!-- Antennae -->
    <line x1="210" y1="130" x2="195" y2="100" stroke="url(#androidGreen)" stroke-width="8" stroke-linecap="round"/>
    <line x1="302" y1="130" x2="317" y2="100" stroke="url(#androidGreen)" stroke-width="8" stroke-linecap="round"/>

    <!-- Head Dome -->
    <path d="M186,170 A70,70 0 0,1 326,170 Z" fill="url(#androidGreen)"/>

    <!-- Eyes -->
    <circle cx="218" cy="148" r="6" fill="#11111b"/>
    <circle cx="294" cy="148" r="6" fill="#11111b"/>

    <!-- Body with Terminal Chest -->
    <rect x="186" y="178" width="140" height="110" rx="16" fill="url(#androidGreen)"/>

    <!-- Left Arm -->
    <rect x="156" y="180" width="22" height="85" rx="11" fill="url(#androidGreen)"/>

    <!-- Right Arm -->
    <rect x="334" y="180" width="22" height="85" rx="11" fill="url(#androidGreen)"/>

    <!-- Left Leg -->
    <rect x="210" y="292" width="24" height="42" rx="12" fill="url(#androidGreen)"/>

    <!-- Right Leg -->
    <rect x="278" y="292" width="24" height="42" rx="12" fill="url(#androidGreen)"/>

    <!-- Terminal Screen on Chest -->
    <rect x="204" y="196" width="104" height="74" rx="8" fill="#181825"/>
    <rect x="204" y="196" width="104" height="74" rx="8" fill="none" stroke="#313244" stroke-width="2"/>

    <!-- Terminal Prompt "> _" -->
    <path d="M218,218 L234,233 L218,248" fill="none" stroke="#89dceb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="244" y1="248" x2="268" y2="248" stroke="#89dceb" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Big Right Lightning Bolt (Actions Power) -->
  <path d="M355,140 L300,230 L345,230 L275,340 L340,250 L305,250 Z" fill="url(#lightningCyan)" filter="url(#glow)"/>

  <!-- "ghapk" Wordmark -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#cdd6f4" text-anchor="middle" letter-spacing="4">ghapk</text>
</svg>
